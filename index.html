<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedro02388 - Chat</title>
    <style>
        /* Estilo Geral e Fundo Animado */
        body {
            background: radial-gradient(circle at top, #141722 0%, #0a0b10 100%);
            color: #ffffff;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Container Principal (Glassmorphism) */
        .main-card {
            background: rgba(22, 27, 34, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            width: 100%;
            max-width: 850px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 30px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            box-sizing: border-box;
        }

        /* Avatar com Brilho Neon */
        .profile-container {
            position: relative;
            display: inline-block;
        }

        .profile-pic {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            border: 3px solid #5865F2;
            box-shadow: 0 0 20px rgba(88, 101, 242, 0.4);
            transition: transform 0.3s ease;
        }

        .profile-pic:hover {
            transform: scale(1.05) rotate(5deg);
        }

        h1 {
            margin: 15px 0 5px 0;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(45deg, #ffffff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Relógio Digital Elegante */
        #relogio {
            font-size: 36px;
            color: #00ff87;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            margin: 15px 0;
            text-shadow: 0 0 15px rgba(0, 255, 135, 0.4);
            letter-spacing: 2px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 15px;
            margin-bottom: 20px;
        }

        /* Botão Discord Premium */
        .btn-discord {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #5865F2 0%, #404eed 100%);
            color: white;
            padding: 14px 28px;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 30px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(88, 101, 242, 0.3);
        }

        .btn-discord:hover {
            background: linear-gradient(135deg, #6773f3 0%, #4e5af5 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(88, 101, 242, 0.5);
        }

        /* Container do Chat Separado */
        .chat-wrapper {
            width: 100%;
            height: 550px;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
            background: #0d1117;
            box-shadow: inset 0 4px 20px rgba(0,0,0,0.5);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Rodapé */
        .footer {
            margin-top: 25px;
            color: #64748b;
            font-size: 13px;
            text-align: center;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="profile-container">
            <img src="https://cdn.discordapp.com/emojis/1484642953681965156.png?v=1&size=48&quality=lossless" class="profile-pic" alt="Avatar">
        </div>
        
        <h1>Pedro02388 - Chat</h1>
        <div id="relogio">00:00:00</div>
        
        <p class="subtitle">Faça parte da nossa comunidade oficial!</p>
        <a href="https://discord.gg/Tnexdv6ZrH" target="_blank" class="btn-discord">Entrar no Servidor Discord</a>

        <div class="chat-wrapper">
            <iframe src="https://pedro02388-ofc.chatango.com/" scrolling="no"></iframe>
        </div>
    </div>

    <div class="footer">
        <p>© 2026 Pedro02388 — Todos os direitos reservados.</p>
    </div>

    <script>
        // Relógio digital com ajuste de zeros à esquerda se necessário
        function startClock() {
            const el = document.getElementById('relogio');
            setInterval(() => {
                const now = new Date();
                el.innerText = now.toLocaleTimeString('pt-BR');
            }, 1000);
        }
        startClock();

        // Segurança básica contra atalhos
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.key === 'F12') e.preventDefault();
            if (e.ctrlKey && (e.key === 'c' || e.key === 'u' || e.key === 's')) e.preventDefault();
        });
    </script>
</body>
</html>
